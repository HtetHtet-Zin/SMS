<!--<!DOCTYPE html>-->
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:p="http://primefaces.org/ui">
    <h:head>
<!--        <meta http-equiv="content-type" content="text/html; charset=UTF-8" />-->
<!--        <meta http-equiv="content-style-type" content="text/css" />-->
<!--        <meta http-equiv="content-script-type" content="text/javascript" />-->

        <link rel="shortcut icon" href="./resources/img/tabimage.ico" type="image/x-icon" />
        <link href="./resources/css/base.css" rel="stylesheet" type="text/css" />
        <link href="./resources/css/header.css" rel="stylesheet" type="text/css" />
        <link href="./resources/css/login.css" rel="stylesheet" type="text/css" />

    </h:head>

    <body id = "login_body">
    <div style=" margin: 0; position: absolute; top: 50%; left: 50%; -ms-transform: translate(-50%, -50%);
    transform: translate(-50%, -50%);">
        <h:form id="login">
            <table align="center">
                <tr>
                    <!-- <td style="width: 500px;"></td> -->
                    <td><p:messages id="msg" howDetail="true" closable="true"/></td>
                </tr>
            </table>
            <center>
                <div id="main"
                     style="width: 700px; height: 400px; background-color: #ffffff; box-shadow: 2px 2px 10px #000000; ">


                    <div style="width: 700px; height: 25px"></div>

                    <div style="width: 700px; height: 60px;">
                        <center>
                            <table>
                                <tr>
                                    <td align="center"><h1>
                                        <font
                                                style="font-family: Georgia, serif; color: #34669A; font-variant: small-caps; text-transform: none; font-weight: 100; margin-bottom: 0; letter-spacing: 6px; font-size: 33px;">Share Management System</font>
                                    </h1>
                                    </td>
                                </tr>
                            </table>
                        </center>
                    </div>

                    <div style="width: 700px; height: 5px; margin: -70px 0px -20px -200px;">
                        <table style="height:100px;">
                            <tr>
                                <td><img src="./resources/img/sms.png"></img></td>
                            </tr>
                        </table>
                    </div>

                    <div style="width: 700px; height: 0px; margin: 50px 50px 50px 100px;">
                        <center>
                            <table>
                                <tr style="height: 70px"></tr>

                                <tr>
                                    <td style="width: 180px;"></td>
                                    <td align="left"><div style="height: 13px; color: #34669A; font-weight: bold;">
                                        <p:outputLabel value="User Name: " />
                                    </div></td>
                                </tr>
                                <tr>
                                    <td style="width: 180px;"></td>
                                    <td><p:inputText id="userId" value="#{loginBean.username}" styleClass="lgn_textbox"/></td>
                                </tr>
                                <tr style="height: 10px"></tr>
                                <tr>
                                    <td style="width: 180px;"></td>
                                    <td align="left"><div style="height: 13px; color: #34669A; font-weight: bold;">
                                        <p:outputLabel value="Password: " />
                                    </div></td>
                                </tr>
                                <tr>
                                    <td style="width: 180px;"></td>
                                    <td align="left"><p:password id="password" redisplay="true" styleClass="lgn_textbox"
                                                                 value="#{loginBean.password}" /></td>
                                </tr>
                                <tr style="height: 10px"></tr>
                                <tr>
                                    <td style="width: 180px;"></td>
                                    <td align="left"><div style="height: 13px; color: #34669A; font-weight: bold;">
                                        <p:outputLabel value="Language : " />
                                    </div></td>
                                </tr>
                                <tr>
                                    <td style="width: 180px;"></td>
                                    <td><p:selectOneMenu value="#{loginBean.language}" styleClass="ui_combo_box_login"
                                    >
                                        <f:selectItem itemValue="en" itemLabel="English" />
                                        <f:selectItem itemValue="mn" itemLabel="Myanmar" />

                                    </p:selectOneMenu></td>
                                </tr>
                                <tr style="height: 60px">
                                    <td style="width: 50px;"></td>
                                    <td align="left"><p:commandButton styleClass="lgn_btn" action="#{loginBean.login()}" value="Login"
                                                                      onclick="this.disabled=true;" oncomplete="this.enabled=true;" update="@form"/>
                                        <p:commandButton styleClass="lgn_btn"
                                                         value="Cancel" action="#{loginBean.loginCancel()}" update="@form"/></td>

                                </tr>
                            </table>
                        </center>
                    </div>
                </div>
            </center>
            <center>
                <table width="700px">
                    <tr>
                        <!-- <td style="width: 480px;"></td>	#34669A  -->
                        <td align="right"><div style="height: 13px; color: #ffffff; font-weight: bold; font-family: Arial;">
                            <h:outputLabel value="Powered By DIR-ACE Technology, Ltd." />
                        </div></td>
                    </tr>
                </table>
            </center>
        </h:form>
    </div>
    </body>
    </html>
