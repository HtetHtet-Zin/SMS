<f:view locale="#{sessionScope['clientInfoBean'].language}"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:a="http://richfaces.org/a4j" xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jstl/core" contentType="text/html">
	<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="ja" lang="ja">
<h:head>
	<meta http-equiv="content-type" content="text/html; charset=UTF-8" />
	<meta http-equiv="content-style-type" content="text/css" />
	<meta http-equiv="content-script-type" content="text/javascript" />
	<meta http-equiv="X-UA-Compatible" content="IE=edge" />
	<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />

	<link rel="shortcut icon"
		href="#{request.contextPath}/img/small_logo.jpg" type="image/x-icon" />

	<!-- Framework CSS and JavaScript -->
	<link href="#{request.contextPath}/simba/stylesheet/message.css"
		rel="stylesheet" type="text/css" />
	<script src="#{request.contextPath}/javascript/SmsScript.js"
		type="text/javascript"></script>

	<!-- Custom CSS and JavaScript -->
	<link href="#{request.contextPath}/stylesheet/shareholder/main.css"
		rel="stylesheet" type="text/css" />
	<!-- Date Time Picker -->
	<link rel="stylesheet"
		href="../stylesheet/shareholder/vendors/date-time-picker/tempusdominus-bootstrap-4.min.css" />

	<!-- Page related CSS  -->
	<ui:insert name="custome_css" />
</h:head>
<body class="sidebar-toggled" onload="loadCommon();removeRedBox();">
	<!-- <ui:debug /> -->

	<!-- This element is necessary to keep Error Element Id Info -->
	<h:inputHidden id="errorElementId"
		value="#{MessageBean.errorInfoBean.errorElementId}" />
	<div id="wrapper">
		<!-- Sidebar content -->
		<ui:include src="/layout/shareholder/sidebar.xhtml" />
		<!-- Main Content -->
		<div id="content-wrapper" class="d-flex flex-column">
			<div id="content">
				<!-- Top navigation bar -->
				<ui:include src="/layout/shareholder/nav.xhtml" />

				<!-- Custom Content Area -->
				<div class="container-fluid">
					<ui:insert name="main_content" />
				</div>
			</div>

			<!-- Footer -->
			<div>
				<ui:include src="/layout/shareholder/footer.xhtml" />
			</div>

		</div>
	</div>
	<!-- Custom javascript  -->
	<ui:insert name="js" />
	<script>
			function removeRedBox()
			{
				if($('.ui-state-error')){
					$('.ui-state-error').removeClass('ui-state-error');
				}
			} 
	</script>
	<!-- Page Wrapper End -->
	<!-- Bootstrap Core JavaScript-->
	<script
		src="../javascript/shareholder/vendors/bootstrapv4.3.1/bootstrap.min.js"></script>
	<!-- Moment.js JavaScript-->
	<script
		src="../javascript/shareholder/vendors/date-time-picker/moment.min.js"></script>
	<!-- Custom Form Components -->
	<script src="../javascript/shareholder/vendors/customform/js/jcf.js"></script>
	<script
		src="../javascript/shareholder/vendors/customform/js/jcf.number.js"></script>
	<script
		src="../javascript/shareholder/vendors/customform/js/jcf.file.js"></script>
	<script
		src="../javascript/shareholder/vendors/customform/js/jcf.select.js"></script>
	<script
		src="../javascript/shareholder/vendors/customform/js/jcf.checkbox.js"></script>
	<script
		src="../javascript/shareholder/vendors/customform/js/jcf.radio.js"></script>
	<!-- Date Time Picker -->
	<script type="text/javascript"
		src="../javascript/shareholder/vendors/date-time-picker/tempusdominus-bootstrap-4.min.js"></script>
	<!-- Custom scripts for all pages-->
	<script src="../javascript/shareholder/script.js"></script>
</body>
	</html>
</f:view>
